<text x="438" y="484" font-family="Geist, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12.5" font-weight="400" fill="#a1a1aa" text-anchor="start" opacity="1.0">Groq key as a SecureString, read at cold start</text>
<text x="438" y="524" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400" fill="#8b8b93" text-anchor="start" opacity="1.0">why: the key never enters repo or logs</text>
<rect x="796" y="420" width="358" height="132" rx="12" fill="#111113" stroke="#34343a"/>
