<text x="60" y="484" font-family="Geist, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12.5" font-weight="400" fill="#a1a1aa" text-anchor="start" opacity="1.0">request_id + per-stage latency on every line</text>
<text x="60" y="524" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400" fill="#8b8b93" text-anchor="start" opacity="1.0">why: any error on screen found in seconds</text>
<rect x="418" y="420" width="358" height="132" rx="12" fill="#111113" stroke="#34343a"/>
<rect x="418" y="420" width="4" height="132" rx="2" fill="#6e9bff"/>
