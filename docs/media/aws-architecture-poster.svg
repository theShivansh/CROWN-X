<text x="60" y="334" font-family="Geist, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12.5" font-weight="400" fill="#a1a1aa" text-anchor="start" opacity="1.0">browser uploads via size-limited pre-signed POST</text>
<text x="60" y="374" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400" fill="#8b8b93" text-anchor="start" opacity="1.0">why: no file bytes pass through Lambda</text>
