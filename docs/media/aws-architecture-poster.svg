<text x="438" y="184" font-family="Geist, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12.5" font-weight="400" fill="#a1a1aa" text-anchor="start" opacity="1.0">CORS + throttles: /query 3 rps, /answer 1 rps</text>
<text x="438" y="224" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400" fill="#8b8b93" text-anchor="start" opacity="1.0">why: a cost control at the edge (ADR-021)</text>
<rect x="796" y="120" width="358" height="132" rx="12" fill="#111113" stroke="#34343a"/>
<rect x="796" y="120" width="4" height="132" rx="2" fill="#6e9bff"/>
<text x="816" y="154" font-family="Geist, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="17" font-weight="600" fill="#ededef" text-anchor="start" opacity="1.0">AWS Lambda × 2</text>
<text x="816" y="184" font-family="Geist, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12.5" font-weight="400" fill="#a1a1aa" text-anchor="start" opacity="1.0">API and ingestion; ONNX embeddings inside</text>
<text x="816" y="224" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400" fill="#8b8b93" text-anchor="start" opacity="1.0">why: scales to zero; no per-call embedding cost</text>
