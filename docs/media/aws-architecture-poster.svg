<text x="40" y="962" font-family="Geist, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" font-weight="400" fill="#8b8b93" text-anchor="start" opacity="1.0">Groq is billed outside AWS and is not included. Numbers: docs/BENCHMARKS.md.</text>
