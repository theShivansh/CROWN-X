<text x="438" y="334" font-family="Geist, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12.5" font-weight="400" fill="#a1a1aa" text-anchor="start" opacity="1.0">BM25 + k-NN in one index, workspace-filtered</text>
<text x="438" y="374" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="400" fill="#8b8b93" text-anchor="start" opacity="1.0">why: hybrid retrieval in one store (ADR-011)</text>
<rect x="796" y="270" width="358" height="132" rx="12" fill="#111113" stroke="#34343a"/>
<rect x="796" y="270" width="4" height="132" rx="2" fill="#6e9bff"/>
