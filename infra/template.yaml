AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: >-
  CROWN-X backend: HTTP API, API and ingestion Lambdas, S3 documents, DynamoDB metadata, and a
  single-node OpenSearch Service domain (ADR-011) in ap-south-1 (ADR-012). Answers come from Groq and
  embeddings from a local ONNX model (ADR-017); Bedrock remains an option.

Parameters:
  AllowedOrigins:
    Type: CommaDelimitedList
    Default: http://localhost:3000
    Description: Browser origins allowed by the API and the upload bucket (add the Amplify domain in S6).
  EmbeddingModelId:
    Type: String
    Default: amazon.titan-embed-text-v2:0
    Description: Bedrock embedding model, used only when EmbeddingProvider is bedrock.
  AnswerModelId:
    Type: String
    Default: ""
    Description: >-
      Bedrock answer model ID, a foundation model in this Region (ADR-013 candidates, still proposed).
      Empty means answering is off and /answer returns 503 answer_unavailable.
  AnswerForceTool:
    Type: String
    Default: "true"
    AllowedValues: ["true", "false"]
    Description: Force the submit_answer tool; "false" for models that only accept toolChoice auto.
  Environment:
    Type: String
    Default: production
    AllowedValues: [production, offline-demo]
    Description: >-
      ADR-016, ADR-017. production answers with Groq or Bedrock and embeds with ONNX or Bedrock, never
      the mock; offline-demo runs the mock providers and must be chosen explicitly. development and test
      are for local runs, never deployed.
  AnswerProvider:
    Type: String
    Default: groq
    AllowedValues: [groq, bedrock, mock]
  EmbeddingProvider:
    Type: String
    Default: onnx
    AllowedValues: [onnx, bedrock, mock]
  EmbeddingVersion:
    Type: String
    Default: "2"
    Description: Bump when chunking or embedding parameters change, so old vectors stay out of queries.
  SearchIndexName:
    Type: String
    Default: crownx-chunks-v2
    Description: >-
      One index per vector size: v2 holds 384-dimension ONNX vectors; the M1 index held Titan's 1024.
  GroqModelId:
    Type: String
    Default: openai/gpt-oss-120b
  GroqFallbackModelId:
    Type: String
    Default: openai/gpt-oss-20b
    Description: Used once when the primary model is rate-limited, times out twice or fails.
  GroqApiKeyParameter:
    Type: String
    Default: /crownx/groq-api-key
    AllowedPattern: "^/[A-Za-z0-9/_.-]+$"
    Description: SSM Parameter Store SecureString holding the Groq API key, created outside the stack.
  OnnxModelName:
    Type: String
    Default: multilingual-e5-small-int8
    AllowedValues: [multilingual-e5-small-int8, bge-small-en-v1.5-int8]
    Description: Published to s3://<DocumentsBucket>/models/<name>/ by scripts/fetch_models.py.
  OnnxModelSha256:
    Type: String
    Default: ""
    Description: sha256 of the published model.onnx; the Lambdas refuse any other file.
  RerankerEnabled:
    Type: String
    Default: "false"
    AllowedValues: ["true", "false"]
  RerankerModelName:
    Type: String
    Default: ms-marco-MiniLM-L-6-v2-int8
  RerankerModelSha256:
    Type: String
    Default: ""
  SearchDomainName:
    Type: String
    Default: crownx-search
    AllowedPattern: "^[a-z][a-z0-9-]{2,27}$"
  SearchInstanceType:
    Type: String
    Default: m7g.medium.search
    AllowedValues: [m7g.medium.search, t3.small.search]
  SearchEngineVersion:
    Type: String
    Default: OpenSearch_3.7
  MaxUploadBytes:
    Type: Number
    Default: 5242880
    MinValue: 1024
  MaxDocumentsPerWorkspace:
    Type: Number
    Default: 20
    MinValue: 1
  RetrievalTopK:
    Type: Number
    Default: 8
    MinValue: 1
    MaxValue: 50

Globals:
  Function:
    Runtime: python3.12
    Architectures: [arm64]
    CodeUri: ../services/api/src
    Environment:
      Variables:
        DOCUMENTS_BUCKET: !Ref DocumentsBucket
        TABLE_NAME: !Ref MetadataTable
        OPENSEARCH_ENDPOINT: !GetAtt SearchDomain.DomainEndpoint
        OPENSEARCH_INDEX: !Ref SearchIndexName
        INGEST_FUNCTION_NAME: !Sub "${AWS::StackName}-ingest"
        BEDROCK_EMBEDDING_MODEL_ID: !Ref EmbeddingModelId
        BEDROCK_ANSWER_MODEL_ID: !Ref AnswerModelId
        BEDROCK_ANSWER_FORCE_TOOL: !Ref AnswerForceTool
        ENVIRONMENT: !Ref Environment
        ANSWER_PROVIDER: !Ref AnswerProvider
        EMBEDDING_PROVIDER: !Ref EmbeddingProvider
        EMBEDDING_VERSION: !Ref EmbeddingVersion
        GROQ_MODEL_ID: !Ref GroqModelId
        GROQ_FALLBACK_MODEL_ID: !Ref GroqFallbackModelId
        GROQ_API_KEY_PARAMETER: !Ref GroqApiKeyParameter
        ONNX_MODEL_NAME: !Ref OnnxModelName
        ONNX_MODEL_URI: !Sub "s3://${DocumentsBucket}/models/${OnnxModelName}/"
        ONNX_MODEL_SHA256: !Ref OnnxModelSha256
        RERANKER_ENABLED: !Ref RerankerEnabled
        RERANKER_MODEL_NAME: !Ref RerankerModelName
        RERANKER_MODEL_URI: !Sub "s3://${DocumentsBucket}/models/${RerankerModelName}/"
        RERANKER_MODEL_SHA256: !Ref RerankerModelSha256
        MAX_UPLOAD_BYTES: !Ref MaxUploadBytes
        MAX_DOCUMENTS_PER_WORKSPACE: !Ref MaxDocumentsPerWorkspace
        RETRIEVAL_TOP_K: !Ref RetrievalTopK
        POWERTOOLS_LOG_LEVEL: INFO

Conditions:
  HasAnswerModel: !And
    - !Equals [!Ref AnswerProvider, bedrock]
    - !Not [!Equals [!Ref AnswerModelId, ""]]
  UseBedrockEmbeddings: !Equals [!Ref EmbeddingProvider, bedrock]
  UseGroq: !Equals [!Ref AnswerProvider, groq]

Resources:
  # ---------------------------------------------------------------- storage

  DocumentsBucket:
    Type: AWS::S3::Bucket
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      CorsConfiguration:
        CorsRules:
          - AllowedMethods: [POST]
            AllowedOrigins: !Ref AllowedOrigins
            AllowedHeaders: ["*"]
            MaxAge: 3000
      LifecycleConfiguration:
        Rules:
          - Id: expire-documents-after-30-days
            Status: Enabled
            ExpirationInDays: 30

  DocumentsBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref DocumentsBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: "*"
            Action: "s3:*"
            Resource:
              - !GetAtt DocumentsBucket.Arn
              - !Sub "${DocumentsBucket.Arn}/*"
            Condition:
              Bool:
                aws:SecureTransport: "false"

  MetadataTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: S
      KeySchema:
        - AttributeName: PK
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE
      SSESpecification:
        SSEEnabled: true

  SearchDomain:
    Type: AWS::OpenSearchService::Domain
    Properties:
      DomainName: !Ref SearchDomainName
      EngineVersion: !Ref SearchEngineVersion
      ClusterConfig:
        InstanceType: !Ref SearchInstanceType
        InstanceCount: 1
        ZoneAwarenessEnabled: false
        DedicatedMasterEnabled: false
      EBSOptions:
        EBSEnabled: true
        VolumeType: gp3
        VolumeSize: 10
      EncryptionAtRestOptions:
        Enabled: true
      NodeToNodeEncryptionOptions:
        Enabled: true
      DomainEndpointOptions:
        EnforceHTTPS: true
        TLSSecurityPolicy: Policy-Min-TLS-1-2-PFS-2023-10
      AccessPolicies:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              AWS:
                - !GetAtt ApiRole.Arn
                - !GetAtt IngestRole.Arn
            Action:
              - es:ESHttpGet
              - es:ESHttpHead
              - es:ESHttpPost
              - es:ESHttpPut
            Resource: !Sub "arn:${AWS::Partition}:es:${AWS::Region}:${AWS::AccountId}:domain/${SearchDomainName}/*"

  # ---------------------------------------------------------------- logs

  ApiLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${AWS::StackName}-api"
      RetentionInDays: 14

  IngestLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${AWS::StackName}-ingest"
      RetentionInDays: 14

  HttpApiAccessLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/http-api/${AWS::StackName}"
      RetentionInDays: 14

  # ---------------------------------------------------------------- IAM (least privilege, no wildcard actions)

  ApiRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: crownx-api
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: Logs
                Effect: Allow
                Action: [logs:CreateLogStream, logs:PutLogEvents]
                Resource: !GetAtt ApiLogGroup.Arn
              - Sid: Metadata
                Effect: Allow
                Action: [dynamodb:GetItem, dynamodb:PutItem, dynamodb:Query]
                Resource: !GetAtt MetadataTable.Arn
              - Sid: HealthAndMissingObjectsAs404
                Effect: Allow
                Action: s3:ListBucket
                Resource: !GetAtt DocumentsBucket.Arn
              - Sid: SignUploadsAndChecksum
                Effect: Allow
                Action: [s3:PutObject, s3:GetObject]
                Resource: !Sub "${DocumentsBucket.Arn}/ws/*"
              - Sid: StartIngestion
                Effect: Allow
                Action: lambda:InvokeFunction
                Resource: !Sub "arn:${AWS::Partition}:lambda:${AWS::Region}:${AWS::AccountId}:function:${AWS::StackName}-ingest"
              - Sid: ReadIndex
                Effect: Allow
                Action: [es:ESHttpGet, es:ESHttpHead, es:ESHttpPost]
                Resource: !Sub "arn:${AWS::Partition}:es:${AWS::Region}:${AWS::AccountId}:domain/${SearchDomainName}/*"
              - !If
                - UseBedrockEmbeddings
                - Sid: EmbedQuestions
                  Effect: Allow
                  Action: bedrock:InvokeModel
                  Resource: !Sub "arn:${AWS::Partition}:bedrock:${AWS::Region}::foundation-model/${EmbeddingModelId}"
                - !Ref AWS::NoValue
              - Sid: ReadModels
                Effect: Allow
                Action: s3:GetObject
                Resource: !Sub "${DocumentsBucket.Arn}/models/*"
              # The Groq key: one SecureString, read once per cold start (AWS-managed aws/ssm key).
              - !If
                - UseGroq
                - Sid: ReadGroqKey
                  Effect: Allow
                  Action: ssm:GetParameter
                  Resource: !Sub "arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter${GroqApiKeyParameter}"
                - !Ref AWS::NoValue
              # Converse is authorized by bedrock:InvokeModel, scoped to the one configured model.
              - !If
                - HasAnswerModel
                - Sid: AnswerQuestions
                  Effect: Allow
                  Action: bedrock:InvokeModel
                  Resource: !Sub "arn:${AWS::Partition}:bedrock:${AWS::Region}::foundation-model/${AnswerModelId}"
                - !Ref AWS::NoValue

  IngestRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: crownx-ingest
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: Logs
                Effect: Allow
                Action: [logs:CreateLogStream, logs:PutLogEvents]
                Resource: !GetAtt IngestLogGroup.Arn
              - Sid: DocumentStatus
                Effect: Allow
                Action: [dynamodb:GetItem, dynamodb:PutItem]
                Resource: !GetAtt MetadataTable.Arn
              - Sid: ReadUploads
                Effect: Allow
                Action: s3:GetObject
                Resource: !Sub "${DocumentsBucket.Arn}/ws/*"
              - Sid: WriteIndex
                Effect: Allow
                Action: [es:ESHttpGet, es:ESHttpHead, es:ESHttpPost, es:ESHttpPut]
                Resource: !Sub "arn:${AWS::Partition}:es:${AWS::Region}:${AWS::AccountId}:domain/${SearchDomainName}/*"
              - !If
                - UseBedrockEmbeddings
                - Sid: EmbedChunks
                  Effect: Allow
                  Action: bedrock:InvokeModel
                  Resource: !Sub "arn:${AWS::Partition}:bedrock:${AWS::Region}::foundation-model/${EmbeddingModelId}"
                - !Ref AWS::NoValue
              - Sid: ReadModels
                Effect: Allow
                Action: s3:GetObject
                Resource: !Sub "${DocumentsBucket.Arn}/models/*"

  # ---------------------------------------------------------------- compute and API

  HttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      CorsConfiguration:
        AllowOrigins: !Ref AllowedOrigins
        AllowMethods: [GET, POST, OPTIONS]
        AllowHeaders: [content-type]
        ExposeHeaders: [x-request-id]
        MaxAge: 600
      DefaultRouteSettings:
        ThrottlingBurstLimit: 20
        ThrottlingRateLimit: 10
      AccessLogSettings:
        DestinationArn: !GetAtt HttpApiAccessLogGroup.Arn
        Format: >-
          {"requestId":"$context.requestId","request_id":"req_$context.requestId",
          "routeKey":"$context.routeKey","status":"$context.status",
          "requestTime":"$context.requestTime","latencyMs":"$context.responseLatency",
          "integrationError":"$context.integrationErrorMessage"}

  ApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${AWS::StackName}-api"
      Handler: crownx.app.api.handler
      Role: !GetAtt ApiRole.Arn
      # ONNX inference is CPU-bound; Lambda CPU scales with memory.
      MemorySize: 2048
      Timeout: 29
      LoggingConfig:
        LogGroup: !Ref ApiLogGroup
      Environment:
        Variables:
          POWERTOOLS_SERVICE_NAME: crownx-api
      Events:
        Health:
          Type: HttpApi
          Properties: {ApiId: !Ref HttpApi, Method: GET, Path: /health}
        CreateWorkspace:
          Type: HttpApi
          Properties: {ApiId: !Ref HttpApi, Method: POST, Path: /workspaces}
        UploadUrl:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Method: POST
            Path: /workspaces/{workspace_id}/documents/upload-url
        CompleteUpload:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Method: POST
            Path: /workspaces/{workspace_id}/documents/{document_id}/complete
        ListDocuments:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Method: GET
            Path: /workspaces/{workspace_id}/documents
        Query:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Method: POST
            Path: /workspaces/{workspace_id}/query
        Answer:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Method: POST
            Path: /workspaces/{workspace_id}/queries/{query_id}/answer
        WorkflowSuggestions:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Method: GET
            Path: /workspaces/{workspace_id}/workflow-suggestions

  IngestFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${AWS::StackName}-ingest"
      Handler: crownx.app.ingest.handler
      Role: !GetAtt IngestRole.Arn
      MemorySize: 2048
      Timeout: 300
      LoggingConfig:
        LogGroup: !Ref IngestLogGroup
      Environment:
        Variables:
          POWERTOOLS_SERVICE_NAME: crownx-ingest
      EventInvokeConfig:
        MaximumRetryAttempts: 2
        MaximumEventAgeInSeconds: 3600

Outputs:
  ApiUrl:
    Description: NEXT_PUBLIC_API_URL for the web app
    Value: !Sub "https://${HttpApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}"
  DocumentsBucketName:
    Value: !Ref DocumentsBucket
  TableName:
    Value: !Ref MetadataTable
  SearchDomainEndpoint:
    Value: !GetAtt SearchDomain.DomainEndpoint
  IngestFunctionName:
    Description: Invoke with {"action":"ensure_index"} once after each deploy
    Value: !Ref IngestFunction
