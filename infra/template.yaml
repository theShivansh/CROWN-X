AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: >-
  CROWN-X M1 backend: HTTP API, API and ingestion Lambdas, S3 documents, DynamoDB metadata,
  and a single-node OpenSearch Service domain (ADR-011) in ap-south-1 (ADR-012).

Parameters:
  AllowedOrigins:
    Type: CommaDelimitedList
    Default: http://localhost:3000
    Description: Browser origins allowed by the API and the upload bucket (add the Amplify domain in S6).
  EmbeddingModelId:
    Type: String
    Default: amazon.titan-embed-text-v2:0
    Description: Bedrock embedding model (ADR-013), called in-Region.
  AnswerModelId:
    Type: String
    Default: ""
    Description: Bedrock answer model or inference profile, used from M2 (ADR-013).
  SearchDomainName:
    Type: String
    Default: crownx-search
    AllowedPattern: "^[a-z][a-z0-9-]{2,27}$"
  SearchInstanceType:
    Type: String
    Default: m7g.medium.search
    AllowedValues: [m7g.medium.search, t3.small.search]
  SearchEngineVersion:
    Type: String
    Default: OpenSearch_3.7
  MaxUploadBytes:
    Type: Number
    Default: 5242880
    MinValue: 1024
  MaxDocumentsPerWorkspace:
    Type: Number
    Default: 20
    MinValue: 1
  RetrievalTopK:
    Type: Number
    Default: 8
    MinValue: 1
    MaxValue: 50

Globals:
  Function:
    Runtime: python3.12
    Architectures: [arm64]
    CodeUri: ../services/api/src
    Environment:
      Variables:
        DOCUMENTS_BUCKET: !Ref DocumentsBucket
        TABLE_NAME: !Ref MetadataTable
        OPENSEARCH_ENDPOINT: !GetAtt SearchDomain.DomainEndpoint
        OPENSEARCH_INDEX: crownx-chunks
        INGEST_FUNCTION_NAME: !Sub "${AWS::StackName}-ingest"
        BEDROCK_EMBEDDING_MODEL_ID: !Ref EmbeddingModelId
        BEDROCK_ANSWER_MODEL_ID: !Ref AnswerModelId
        MAX_UPLOAD_BYTES: !Ref MaxUploadBytes
        MAX_DOCUMENTS_PER_WORKSPACE: !Ref MaxDocumentsPerWorkspace
        RETRIEVAL_TOP_K: !Ref RetrievalTopK
        POWERTOOLS_LOG_LEVEL: INFO

Resources:
  # ---------------------------------------------------------------- storage

  DocumentsBucket:
    Type: AWS::S3::Bucket
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      CorsConfiguration:
        CorsRules:
          - AllowedMethods: [POST]
            AllowedOrigins: !Ref AllowedOrigins
            AllowedHeaders: ["*"]
            MaxAge: 3000
      LifecycleConfiguration:
        Rules:
          - Id: expire-documents-after-30-days
            Status: Enabled
            ExpirationInDays: 30

  DocumentsBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref DocumentsBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: "*"
            Action: "s3:*"
            Resource:
              - !GetAtt DocumentsBucket.Arn
              - !Sub "${DocumentsBucket.Arn}/*"
            Condition:
              Bool:
                aws:SecureTransport: "false"

  MetadataTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: S
      KeySchema:
        - AttributeName: PK
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE
      SSESpecification:
        SSEEnabled: true

  SearchDomain:
    Type: AWS::OpenSearchService::Domain
    Properties:
      DomainName: !Ref SearchDomainName
      EngineVersion: !Ref SearchEngineVersion
      ClusterConfig:
        InstanceType: !Ref SearchInstanceType
        InstanceCount: 1
        ZoneAwarenessEnabled: false
        DedicatedMasterEnabled: false
      EBSOptions:
        EBSEnabled: true
        VolumeType: gp3
        VolumeSize: 10
      EncryptionAtRestOptions:
        Enabled: true
      NodeToNodeEncryptionOptions:
        Enabled: true
      DomainEndpointOptions:
        EnforceHTTPS: true
        TLSSecurityPolicy: Policy-Min-TLS-1-2-PFS-2023-10
      AccessPolicies:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              AWS:
                - !GetAtt ApiRole.Arn
                - !GetAtt IngestRole.Arn
            Action:
              - es:ESHttpGet
              - es:ESHttpHead
              - es:ESHttpPost
              - es:ESHttpPut
            Resource: !Sub "arn:${AWS::Partition}:es:${AWS::Region}:${AWS::AccountId}:domain/${SearchDomainName}/*"

  # ---------------------------------------------------------------- logs

  ApiLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${AWS::StackName}-api"
      RetentionInDays: 14

  IngestLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${AWS::StackName}-ingest"
      RetentionInDays: 14

  HttpApiAccessLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/http-api/${AWS::StackName}"
      RetentionInDays: 14

  # ---------------------------------------------------------------- IAM (least privilege, no wildcard actions)

  ApiRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: crownx-api
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: Logs
                Effect: Allow
                Action: [logs:CreateLogStream, logs:PutLogEvents]
                Resource: !GetAtt ApiLogGroup.Arn
              - Sid: Metadata
                Effect: Allow
                Action: [dynamodb:GetItem, dynamodb:PutItem, dynamodb:Query]
                Resource: !GetAtt MetadataTable.Arn
              - Sid: HealthAndMissingObjectsAs404
                Effect: Allow
                Action: s3:ListBucket
                Resource: !GetAtt DocumentsBucket.Arn
              - Sid: SignUploadsAndChecksum
                Effect: Allow
                Action: [s3:PutObject, s3:GetObject]
                Resource: !Sub "${DocumentsBucket.Arn}/ws/*"
              - Sid: StartIngestion
                Effect: Allow
                Action: lambda:InvokeFunction
                Resource: !Sub "arn:${AWS::Partition}:lambda:${AWS::Region}:${AWS::AccountId}:function:${AWS::StackName}-ingest"
              - Sid: ReadIndex
                Effect: Allow
                Action: [es:ESHttpGet, es:ESHttpHead, es:ESHttpPost]
                Resource: !Sub "arn:${AWS::Partition}:es:${AWS::Region}:${AWS::AccountId}:domain/${SearchDomainName}/*"
              - Sid: EmbedQuestions
                Effect: Allow
                Action: bedrock:InvokeModel
                Resource: !Sub "arn:${AWS::Partition}:bedrock:${AWS::Region}::foundation-model/${EmbeddingModelId}"

  IngestRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: crownx-ingest
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: Logs
                Effect: Allow
                Action: [logs:CreateLogStream, logs:PutLogEvents]
                Resource: !GetAtt IngestLogGroup.Arn
              - Sid: DocumentStatus
                Effect: Allow
                Action: [dynamodb:GetItem, dynamodb:PutItem]
                Resource: !GetAtt MetadataTable.Arn
              - Sid: ReadUploads
                Effect: Allow
                Action: s3:GetObject
                Resource: !Sub "${DocumentsBucket.Arn}/ws/*"
              - Sid: WriteIndex
                Effect: Allow
                Action: [es:ESHttpGet, es:ESHttpHead, es:ESHttpPost, es:ESHttpPut]
                Resource: !Sub "arn:${AWS::Partition}:es:${AWS::Region}:${AWS::AccountId}:domain/${SearchDomainName}/*"
              - Sid: EmbedChunks
                Effect: Allow
                Action: bedrock:InvokeModel
                Resource: !Sub "arn:${AWS::Partition}:bedrock:${AWS::Region}::foundation-model/${EmbeddingModelId}"

  # ---------------------------------------------------------------- compute and API

  HttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      CorsConfiguration:
        AllowOrigins: !Ref AllowedOrigins
        AllowMethods: [GET, POST, OPTIONS]
        AllowHeaders: [content-type]
        ExposeHeaders: [x-request-id]
        MaxAge: 600
      DefaultRouteSettings:
        ThrottlingBurstLimit: 20
        ThrottlingRateLimit: 10
      AccessLogSettings:
        DestinationArn: !GetAtt HttpApiAccessLogGroup.Arn
        Format: >-
          {"requestId":"$context.requestId","request_id":"req_$context.requestId",
          "routeKey":"$context.routeKey","status":"$context.status",
          "requestTime":"$context.requestTime","latencyMs":"$context.responseLatency",
          "integrationError":"$context.integrationErrorMessage"}

  ApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${AWS::StackName}-api"
      Handler: crownx.app.api.handler
      Role: !GetAtt ApiRole.Arn
      MemorySize: 512
      Timeout: 29
      LoggingConfig:
        LogGroup: !Ref ApiLogGroup
      Environment:
        Variables:
          POWERTOOLS_SERVICE_NAME: crownx-api
      Events:
        Health:
          Type: HttpApi
          Properties: {ApiId: !Ref HttpApi, Method: GET, Path: /health}
        CreateWorkspace:
          Type: HttpApi
          Properties: {ApiId: !Ref HttpApi, Method: POST, Path: /workspaces}
        UploadUrl:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Method: POST
            Path: /workspaces/{workspace_id}/documents/upload-url
        CompleteUpload:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Method: POST
            Path: /workspaces/{workspace_id}/documents/{document_id}/complete
        ListDocuments:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Method: GET
            Path: /workspaces/{workspace_id}/documents
        Query:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Method: POST
            Path: /workspaces/{workspace_id}/query
        Answer:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Method: POST
            Path: /workspaces/{workspace_id}/queries/{query_id}/answer

  IngestFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${AWS::StackName}-ingest"
      Handler: crownx.app.ingest.handler
      Role: !GetAtt IngestRole.Arn
      MemorySize: 1024
      Timeout: 300
      LoggingConfig:
        LogGroup: !Ref IngestLogGroup
      Environment:
        Variables:
          POWERTOOLS_SERVICE_NAME: crownx-ingest
      EventInvokeConfig:
        MaximumRetryAttempts: 2
        MaximumEventAgeInSeconds: 3600

Outputs:
  ApiUrl:
    Description: NEXT_PUBLIC_API_URL for the web app
    Value: !Sub "https://${HttpApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}"
  DocumentsBucketName:
    Value: !Ref DocumentsBucket
  TableName:
    Value: !Ref MetadataTable
  SearchDomainEndpoint:
    Value: !GetAtt SearchDomain.DomainEndpoint
  IngestFunctionName:
    Description: Invoke with {"action":"ensure_index"} once after each deploy
    Value: !Ref IngestFunction
