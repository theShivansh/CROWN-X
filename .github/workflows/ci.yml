name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  harness:
    name: Harness checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --quiet pytest ruff
      - run: python scripts/validate_kit.py
      - run: ruff check .claude/hooks scripts tests
      - run: python -m pytest tests -q

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Free for personal accounts. A repository owned by an organization needs a
      # GITLEAKS_LICENSE secret; see the gitleaks-action README.
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  web:
    name: Web (lint, typecheck, test, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: apps/web/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  api:
    name: API (ruff, pytest, template checks)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/api
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv python install 3.12
      - run: uv lock --check
      - run: uv sync --frozen
      - run: uv run ruff check src tests
      - run: uv run pytest -q
      # The Lambda bundle is built from requirements.txt, so it must match uv.lock.
      - name: requirements.txt matches uv.lock
        run: |
          uv export --no-dev --no-hashes --no-emit-project --format requirements-txt -o src/requirements.txt
          git diff --exit-code -- src/requirements.txt
      - run: uvx cfn-lint ../../infra/template.yaml
      - uses: aws-actions/setup-sam@v2
        with:
          use-installer: true
      - run: sam validate --lint --template-file ../../infra/template.yaml --region ap-south-1
