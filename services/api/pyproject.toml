[project]
name = "crownx-api"
version = "0.1.0"
description = "CROWN-X API and ingestion Lambdas (Python 3.12, AWS SAM)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "aws-lambda-powertools>=3",
    "boto3>=1.40",
    "numpy>=2.5.3",
    "onnxruntime>=1.30.0",
    "opensearch-py>=2.8",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "pypdf>=6.19.0",
    "tokenizers>=0.23.2",
]

[dependency-groups]
dev = [
    "faiss-cpu>=1.15.1",
    "fpdf2>=2.8.8",
    "onnx>=1.22.0",
    "pytest>=8",
    "pyyaml>=6.0.3",
    "rank-bm25>=0.2.2",
    "ruff>=0.15",
]

[tool.uv]
# Lambda code is deployed from src/ by SAM, not installed as a package.
package = false

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
extend = "../../ruff.toml"
target-version = "py312"
